name: knowbase

# Shared by migrate, api, and worker: one backend image, one configuration.
x-backend: &backend
  build:
    context: ./backend
  image: knowbase-backend:dev
  env_file:
    - path: .env
      required: true
  networks: [data, egress]
  # The images run as a non-root user; nothing in them may gain privileges (setuid) later.
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep PGDATA at /var/lib/postgresql/18/docker,
      # so the volume mounts the parent directory, not .../data.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # No published port and no route out of the stack.
    networks: [data]
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    # --no-proxy-headers: uvicorn would otherwise trust X-Forwarded-* from loopback.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    ports:
      # Localhost only. Set API_HOST_PORT if 8000 is taken on the host.
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker.runner"]
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined into the browser bundle at build time; the browser calls the API directly.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${API_HOST_PORT:-8000}/api/v1}
        NEXT_PUBLIC_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    image: knowbase-frontend:dev
    security_opt: ["no-new-privileges:true"]
    # No env_file: the frontend never receives backend settings or secrets such as GEMINI_API_KEY.
    ports:
      # Localhost only. Open http://localhost:3000 (it must match FRONTEND_ORIGIN exactly).
      - "127.0.0.1:3000:3000"
    # Its own network: no route to the database, and it makes no server-side API calls.
    networks: [web]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:

networks:
  # Database traffic only. `internal` means no route to the internet.
  data:
    internal: true
  # Outbound access for Gemini calls (api, worker),
  # and the network that carries the API's published localhost port.
  egress: {}
  # The frontend's published localhost port only.
  web: {}
